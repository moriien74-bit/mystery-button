<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>謎のボタン</title>
<style>
:root{--main:#ff3030;--bg:#080808;--text:#f5f5f5;--sub:#888}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 50% 35%,rgba(255,48,48,.1),transparent 34%),var(--bg);color:var(--text);font-family:"Yu Gothic","Meiryo",Arial,sans-serif;display:flex;justify-content:center;align-items:center;overflow-x:hidden;transition:background .6s}
.app{width:min(760px,94vw);padding:24px 14px 34px;text-align:center}
.topline{color:#555;font:11px/1.4 Consolas,monospace;letter-spacing:4px;margin-bottom:16px}
h1{margin:0;font-size:clamp(2.5rem,11vw,5.4rem);letter-spacing:.12em;text-shadow:0 0 24px var(--main)}
.subtitle{min-height:26px;margin:10px auto 28px;color:var(--sub);line-height:1.7}
.button-wrap{width:min(280px,68vw);height:min(280px,68vw);margin:0 auto}
#mainButton{width:100%;height:100%;border-radius:50%;border:9px solid rgba(255,255,255,.12);background:radial-gradient(circle at 32% 26%,#fff 0 3%,#ffd0d0 4% 7%,var(--main) 18%,#3d0000 78%);color:#fff;font-size:clamp(1.6rem,6vw,2.2rem);font-weight:900;cursor:pointer;box-shadow:0 0 26px var(--main),0 0 76px rgba(255,0,0,.16),inset 0 -22px 30px rgba(0,0,0,.55);transition:transform .08s,filter .2s;touch-action:manipulation}
#mainButton:active{transform:scale(.91)}
.counter-label{margin-top:28px;color:#666;font-size:11px;letter-spacing:4px}
#counter{margin:3px 0;font:800 clamp(3rem,12vw,6rem) Consolas,monospace;text-shadow:0 0 20px var(--main)}
#message{min-height:30px;margin-top:10px;color:#aaa}
.level{width:min(540px,100%);margin:22px auto 0}
#levelName{margin-bottom:8px;color:#777;font:12px/1.4 Consolas,monospace;letter-spacing:2px}
.bar{height:10px;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:999px;overflow:hidden}
#barFill{height:100%;width:0;background:var(--main);box-shadow:0 0 14px var(--main);transition:width .25s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px auto 0}
.card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px}
.card-title{font-size:10px;letter-spacing:3px;color:#555}.card-value{margin-top:7px;color:#ddd;font:18px Consolas,monospace}
.log{margin-top:15px;padding:13px;max-height:145px;overflow:auto;text-align:left;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.07);border-radius:14px;color:#666;font:12px/1.7 Consolas,monospace}
.log div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.small{margin-top:14px;color:#454545;font-size:11px}
.shake{animation:shake .22s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.flash{animation:flash .16s}@keyframes flash{0%{filter:brightness(1)}50%{filter:brightness(3)}100%{filter:brightness(1)}}
.glitch{animation:glitch .15s infinite}@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}100%{transform:translate(0)}}
#event{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.82)}
.event-box{width:min(520px,94vw);padding:24px;text-align:center;background:#111;border:1px solid var(--main);border-radius:18px}
.event-title{font:11px Consolas,monospace;color:var(--main);letter-spacing:4px}.event-text{margin:16px 0 18px;font-size:clamp(1.1rem,5vw,1.5rem);font-weight:800;line-height:1.6}
.event-btn{border:0;border-radius:10px;padding:11px 20px;background:var(--main);color:#fff;font-weight:800;cursor:pointer}
#miniGame{display:none}.timer{color:#aaa;font:18px Consolas,monospace}
.target-area{position:relative;height:220px;margin-top:14px;background:#080808;border:1px solid #292929;border-radius:14px;overflow:hidden}
#target{position:absolute;width:60px;height:60px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 24px #fff;cursor:pointer}
@media(max-width:600px){.grid{grid-template-columns:1fr}.app{padding-top:18px}.button-wrap{width:min(245px,70vw);height:min(245px,70vw)}}
</style>
</head>
<body>
<main class="app" id="app">
<div class="topline">UNKNOWN SYSTEM // ONLINE</div>
<h1 id="title">謎のボタン</h1>
<div class="subtitle" id="subtitle">なぜここにあるのか、誰も知りません。</div>
<div class="button-wrap"><button id="mainButton" type="button">押す</button></div>
<div class="counter-label">TOTAL PRESSES</div>
<div id="counter">0</div>
<div id="message">まだ何も起きていません。</div>
<section class="level"><div id="levelName">LEVEL 1 — NORMAL</div><div class="bar"><div id="barFill"></div></div></section>
<section class="grid">
<div class="card"><div class="card-title">CURRENT STATUS</div><div class="card-value" id="status">OBSERVING</div></div>
<div class="card"><div class="card-title">SESSION PRESSES</div><div class="card-value" id="session">0</div></div>
</section>
<div class="log" id="log"><div>SYSTEM: 起動しました。</div></div>
<div class="small">※ 回数はこのブラウザに保存されます。</div>
</main>

<div id="event"><div class="event-box">
<div class="event-title">UNKNOWN EVENT</div>
<div class="event-text" id="eventText">何かが起きました。</div>
<button class="event-btn" id="eventClose" type="button">続ける</button>
<div id="miniGame">
<div class="timer">制限時間：<span id="time">5.0</span>秒</div>
<div class="target-area" id="targetArea"><button id="target" type="button" aria-label="ターゲット"></button></div>
</div>
</div></div>

<script>
let count=Number(localStorage.getItem("mystery_count")||0),sessionCount=0,eventOpen=false,miniGameRunning=false,gameTimer=null;
const $=id=>document.getElementById(id);
const mainButton=$("mainButton"),counter=$("counter"),message=$("message"),title=$("title"),subtitle=$("subtitle"),status=$("status"),session=$("session"),levelName=$("levelName"),barFill=$("barFill"),log=$("log"),event=$("event"),eventText=$("eventText"),eventClose=$("eventClose"),miniGame=$("miniGame"),target=$("target"),targetArea=$("targetArea"),timeDisplay=$("time");
const messages=["記録されました。","……。","何も起きません。","本当に何も起きていません。","なぜ押した？","まだ足りません。","誰かも押しています。","見られています。","もう一度。","気のせいです。"];
const levels=[
{min:0,max:9,name:"LEVEL 1 — NORMAL",color:"#ff3030",bg:"#080808"},
{min:10,max:49,name:"LEVEL 2 — BLUE",color:"#238cff",bg:"#050b18"},
{min:50,max:99,name:"LEVEL 3 — PURPLE",color:"#a855f7",bg:"#10051a"},
{min:100,max:499,name:"LEVEL 4 — GREEN",color:"#20d878",bg:"#03140b"},
{min:500,max:999,name:"LEVEL 5 — ORANGE",color:"#ff8a00",bg:"#170c00"},
{min:1000,max:4999,name:"LEVEL 6 — PINK",color:"#ff28b8",bg:"#170010"},
{min:5000,max:9999,name:"LEVEL 7 — VOID",color:"#7c4dff",bg:"#090510"},
{min:10000,max:Infinity,name:"LEVEL ∞ — UNKNOWN",color:"#fff",bg:"#000"}
];
function addLog(text){const d=new Date(),t=[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,"0")).join(":");const el=document.createElement("div");el.textContent="["+t+"] "+text;log.appendChild(el);while(log.children.length>8)log.removeChild(log.firstChild)}
function getLevel(){return levels.find(l=>count>=l.min&&count<=l.max)||levels[0]}
function updateWorld(){counter.textContent=count.toLocaleString();session.textContent=sessionCount.toLocaleString();const l=getLevel();document.documentElement.style.setProperty("--main",l.color);document.documentElement.style.setProperty("--bg",l.bg);levelName.textContent=l.name;const p=l.max===Infinity?(count%1000)/10:((count-l.min)/(l.max-l.min+1))*100;barFill.style.width=Math.max(0,Math.min(100,p))+"%"}
function save(){localStorage.setItem("mystery_count",String(count))}
function specialEvent(){
if(count===10){title.textContent="変化しました。";subtitle.textContent="気のせいではありません。";addLog("WORLD SHIFT")}
if(count===25){title.textContent="誰かいる。";status.textContent="UNKNOWN";addLog("UNKNOWN SIGNAL")}
if(count===50){title.textContent="まだ続けるの？";mainButton.textContent="続ける";addLog("BEHAVIOR: ABNORMAL")}
if(count===100){title.textContent="観測対象";subtitle.textContent="あなたは100回押しました。";addLog("SUBJECT IDENTIFIED")}
if(count===500){title.textContent="500";subtitle.textContent="普通なら、もう飽きています。";addLog("PERSISTENCE WARNING")}
if(count===1000){title.textContent="∞";subtitle.textContent="ここから先は未知の領域です。";status.textContent="UNSTABLE";$("app").classList.add("glitch");addLog("SYSTEM LIMIT: UNKNOWN")}
if(count===5000){title.textContent="VOID";subtitle.textContent="数字に意味があるとは限りません。";addLog("VOID ACCESS")}
if(count===10000){title.textContent="？？？";subtitle.textContent="あなたは何をしている？";status.textContent="YOU ARE STILL HERE";addLog("CRITICAL PERSISTENCE")}
}
function randomEvent(){const r=Math.random();
if(r<.035){document.body.classList.add("flash");setTimeout(()=>document.body.classList.remove("flash"),180);message.textContent="ERROR: 世界の整合性を確認できません。";addLog("ERROR EVENT");return}
if(r<.07){message.textContent="誰かが、あなたと同時に押しました。";addLog("UNKNOWN USER ACTIVITY");return}
if(r<.10){event.style.display="flex";eventOpen=true;miniGame.style.display="none";eventClose.style.display="inline-block";eventText.textContent="ボタンがあなたを見ています。";addLog("UNKNOWN EVENT");return}
if(r<.125&&count>=20){startMiniGame();return}
if(r<.145){mainButton.textContent="？";message.textContent="ボタンの状態が変化しました。";setTimeout(()=>mainButton.textContent=count>=50?"続ける":"押す",700);addLog("BUTTON STATE CHANGED")}
}
function startMiniGame(){event.style.display="flex";eventOpen=true;miniGame.style.display="block";eventClose.style.display="none";eventText.textContent="5秒以内に白い円をクリックしろ。";miniGameRunning=true;let remaining=5;timeDisplay.textContent=remaining.toFixed(1);moveTarget();clearInterval(gameTimer);gameTimer=setInterval(()=>{remaining-=.1;timeDisplay.textContent=Math.max(remaining,0).toFixed(1);if(remaining<=0){clearInterval(gameTimer);miniGameRunning=false;eventText.textContent="失敗。……でも、何も起きない。";miniGame.style.display="none";eventClose.style.display="inline-block";addLog("MINIGAME FAILED")}},100)}
function moveTarget(){const maxX=Math.max(1,targetArea.clientWidth-target.offsetWidth),maxY=Math.max(1,targetArea.clientHeight-target.offsetHeight);target.style.left=Math.floor(Math.random()*maxX)+"px";target.style.top=Math.floor(Math.random()*maxY)+"px"}
eventClose.addEventListener("click",()=>{event.style.display="none";eventOpen=false});
target.addEventListener("click",()=>{if(!miniGameRunning)return;clearInterval(gameTimer);miniGameRunning=false;count+=25;sessionCount+=25;save();updateWorld();eventText.textContent="成功。ボーナス +25";miniGame.style.display="none";eventClose.style.display="inline-block";addLog("MINIGAME SUCCESS +25")});
mainButton.addEventListener("click",()=>{if(eventOpen)return;count++;sessionCount++;save();message.textContent=messages[Math.floor(Math.random()*messages.length)];document.body.classList.remove("shake");void document.body.offsetWidth;document.body.classList.add("shake");updateWorld();specialEvent();randomEvent()});
updateWorld();addLog("WORLD READY");
</script>
</body>
</html>
