<!DOCTYPE html>
<html lang="ja">
<head>
click.mp3
rare.mp3
evolve.mp3
treasure.mp3
split.mp3
fake.mp3
escape.mp3
  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body {
    touch-action: manipulation;
  }
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>謎のボタン 完全版</title>

<style>
html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:#080808;
  color:white;
  font-family:Arial,"Yu Gothic",sans-serif;
  transition:background 1s;
}

main{
  width:100%;
  max-width:700px;
  padding:20px;
}

h1{
  font-size:clamp(40px,10vw,80px);
  margin:10px 0;
  text-shadow:0 0 20px red;
}

p{
  color:#888;
}

#button{
  width:min(70vw,280px);
  height:min(70vw,280px);
  border-radius:50%;
  border:8px solid #333;
  background:#e22;
  color:white;
  font-size:32px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 40px #e22;
  transition:transform .1s, box-shadow .3s;
}

#button:active{
  transform:scale(.92);
}

#count{
  font-size:clamp(45px,12vw,80px);
  font-weight:bold;
  margin:20px;
}

/* 宝箱 */
#treasure{
  display:none;
  margin-top:20px;
  font-size:28px;
  color:gold;
  text-shadow:0 0 10px gold;
}

/* 分裂ボタン */
.split-btn{
  width:120px;
  height:120px;
  border-radius:50%;
  border:5px solid #333;
  background:#444;
  color:white;
  font-size:20px;
  margin:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<main>
<h1>謎のボタン</h1>

<p>なぜここにあるのか、誰も知りません。</p>

<button id="button">押す</button>

<div id="count">0</div>

<p>このブラウザでの回数</p>

<div id="treasure"></div>
<div id="split-area"></div>

</main>

<script>
let count = Number(localStorage.getItem("mystery_count")) || 0;

const button = document.getElementById("button");
const countText = document.getElementById("count");
const treasure = document.getElementById("treasure");
const splitArea = document.getElementById("split-area");

countText.textContent = count;

// レアイベント管理
let lastRare = Number(localStorage.getItem("last_rare")) || 0;

// 背景変化（昼→夕→夜）
function updateBackground(){
  const r = Math.floor(Math.random()*50);
  const g = Math.floor(Math.random()*50);
  const b = Math.floor(Math.random()*50 + 150);
  document.body.style.background = `rgb(${r},${g},${b})`;
}
updateBackground();

// 激レアイベント（1/300）
function rareEvent(){
  if(count - lastRare < 20) return false;
  if(Math.random() < 1/300){
    lastRare = count;
    localStorage.setItem("last_rare",lastRare);

    button.style.boxShadow = "0 0 80px red";
    button.style.transform = "scale(1.1)";
    alert("ボタンがあなたを見ています。");
    button.style.transform = "";
    return true;
  }
  return false;
}

// 進化イベント（100回）
function evolveEvent(){
  if(count === 100){
    button.style.background = "#2e2";
    button.style.boxShadow = "0 0 40px #2e2";
    alert("ボタンが進化した…！");
  }
}

// 宝箱イベント（1/200）
function treasureEvent(){
  if(Math.random() < 1/200){
    treasure.style.display = "block";
    const msgs = [
      "古びた鍵を手に入れた。",
      "ボタンの秘密に近づいた気がする。",
      "何かが遠くで動いたようだ。",
      "あなたは選ばれし者かもしれない。"
    ];
    treasure.textContent = msgs[Math.floor(Math.random()*msgs.length)];
  }
}

// 分裂イベント（1/250）
function splitEvent(){
  if(Math.random() < 1/250){
    splitArea.innerHTML = "";
    const realIndex = Math.floor(Math.random()*2);

    for(let i=0;i<2;i++){
      const btn = document.createElement("button");
      btn.className = "split-btn";
      btn.textContent = "押す";

      btn.addEventListener("click",()=>{
        if(i === realIndex){
          alert("本物のボタンだった！");
        }else{
          alert("ボタンが笑っています。");
        }
        splitArea.innerHTML = "";
      });

      splitArea.appendChild(btn);
    }
  }
}

// 逃げるイベント（1/150）
function escapeEvent(){
  if(Math.random() < 1/150){
    const x = Math.random()*200 - 100;
    const y = Math.random()*200 - 100;
    button.style.transform = `translate(${x}px,${y}px)`;
    setTimeout(()=>button.style.transform="",800);
  }
}

button.addEventListener("click",function(){

  count++;
  localStorage.setItem("mystery_count",count);
  countText.textContent = count;

  updateBackground();

  // イベント発動
  rareEvent();
  evolveEvent();
  treasureEvent();
  splitEvent();
  escapeEvent();

});
</script>

</body>
</html>
